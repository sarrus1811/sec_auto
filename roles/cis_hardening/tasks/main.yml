---
- name: Ensure SELinux is in Enforcing mode (CIS 1.6.1.4)
  ansible.posix.selinux:
    policy: targeted
    state: enforcing

- name: Ensure auditd, firewalld, and openssh-server are installed (CIS 3.4 / 4.1 / 5.2)
  ansible.builtin.dnf:
    name:
      - audit
      - firewalld
      - openssh-server
      - openscap-scanner
      - scap-security-guide
    state: present

- name: Enable and start auditd and firewalld services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - auditd
    - firewalld

- name: Apply CIS Kernel & Network Hardening sysctls (Preserving Podman & GDB/eBPF)
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-cis-secops.conf
    state: present
    reload: true
  loop:
    # CIS Kernel Memory & Pointer Protections
    - { key: "kernel.randomize_va_space", value: "2" }
    - { key: "kernel.kptr_restrict", value: "1" }
    - { key: "kernel.dmesg_restrict", value: "1" }
    - { key: "fs.suid_dumpable", value: "0" }
    - { key: "fs.protected_hardlinks", value: "1" }
    - { key: "fs.protected_symlinks", value: "1" }
    # Preserve Rootless Podman user namespaces & GDB/Frida child-process ptrace
    - { key: "user.max_user_namespaces", value: "65536" }
    - { key: "kernel.yama.ptrace_scope", value: "1" }
    # CIS Network Stack Hardening (IPv4/IPv6)
    - { key: "net.ipv4.ip_forward", value: "1" }
    - { key: "net.ipv4.conf.all.send_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.send_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.accept_source_route", value: "0" }
    - { key: "net.ipv4.conf.default.accept_source_route", value: "0" }
    - { key: "net.ipv4.conf.all.accept_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.accept_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.secure_redirects", value: "0" }
    - { key: "net.ipv4.conf.default.secure_redirects", value: "0" }
    - { key: "net.ipv4.conf.all.log_martians", value: "1" }
    - { key: "net.ipv4.conf.default.log_martians", value: "1" }
    - { key: "net.ipv4.icmp_echo_ignore_broadcasts", value: "1" }
    - { key: "net.ipv4.icmp_ignore_bogus_error_responses", value: "1" }
    - { key: "net.ipv4.conf.all.rp_filter", value: "1" }
    - { key: "net.ipv4.conf.default.rp_filter", value: "1" }
    - { key: "net.ipv4.tcp_syncookies", value: "1" }
    - { key: "net.ipv6.conf.all.accept_ra", value: "0" }
    - { key: "net.ipv6.conf.default.accept_ra", value: "0" }
    - { key: "net.ipv6.conf.all.accept_redirects", value: "0" }
    - { key: "net.ipv6.conf.default.accept_redirects", value: "0" }

- name: Deploy CIS Auditd Rules for Privilege Escalation, Identity & eBPF Syscalls (CIS 4.1.3)
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/50-cis-secops.rules
    owner: root
    group: root
    mode: '0640'
    content: |
      # CIS 4.1.3 - Monitor time, identity, network, sudoers, and kernel module/eBPF loading
      -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
      -w /etc/group -p wa -k identity
      -w /etc/passwd -p wa -k identity
      -w /etc/gshadow -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/sudoers -p wa -k scope
      -w /etc/sudoers.d -p wa -k scope
      -a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules
      -a always,exit -F arch=b64 -S bpf -k ebpf_activity
  register: audit_rules

- name: Reload augenrules when audit rules change
  ansible.builtin.command:
    cmd: augenrules --load
  when: audit_rules.changed
  failed_when: false

- name: Ensure SSH host keys are generated before validating sshd configuration
  ansible.builtin.command:
    cmd: ssh-keygen -A
    creates: /etc/ssh/ssh_host_ed25519_key

- name: Apply CIS SSH Daemon Hardening in drop-in config without locking out {{ analyst_user }} (CIS 5.2)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/60-cis-hardening.conf
    owner: root
    group: root
    mode: '0600'
    content: |
      PermitRootLogin no
      PermitEmptyPasswords no
      MaxAuthTries 4
      ClientAliveInterval 300
      ClientAliveCountMax 3
      LoginGraceTime 60
      X11Forwarding no
      AllowUsers {{ analyst_user }}
  register: sshd_dropin

- name: Validate full sshd configuration and restart sshd
  ansible.builtin.shell: |
    sshd -t && systemctl restart sshd
  when: sshd_dropin.changed